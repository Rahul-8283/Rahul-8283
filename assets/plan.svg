<g><text x="108" y="67" class="mono" font-size="12.5" fill="#8d97a1" textLength="120.0" lengthAdjust="spacing">rahul@github ~ %</text></g><clipPath id="type0"><rect x="235.5" y="53" width="82.5" height="20"><animate attributeName="width" dur="6.0s" fill="freeze" calcMode="discrete" values="0;7.5;15.0;22.5;30.0;37.5;45.0;52.5;60.0;67.5;75.0;82.5" keyTimes="0;0.1500;0.1625;0.1750;0.1875;0.2000;0.2125;0.2250;0.2375;0.2500;0.2625;0.2750"/></rect></clipPath><g clip-path="url(#type0)"><text x="235.5" y="67" class="mono" font-size="12.5" fill="#f2f4f5" textLength="82.5" lengthAdjust="spacing">cat ~/.plan</text></g><g><animate attributeName="opacity" dur="6.0s" fill="freeze" calcMode="discrete" values="0;1" keyTimes="0;0.3375"/><text x="108.0" y="86" class="mono" font-size="12.5" fill="#f2f4f5" textLength="345.0" lengthAdjust="spacing">full-stack developer, gone deep on agentic AI.</text></g><g><animate attributeName="opacity" dur="6.0s" fill="freeze" calcMode="discrete" values="0;1" keyTimes="0;0.3375"/><text x="108.0" y="105" class="mono" font-size="12.5" fill="#c3cad1" textLength="517.5" lengthAdjust="spacing">i build products where the model is one moving part of a real system:</text></g><g><animate attributeName="opacity" dur="6.0s" fill="freeze" calcMode="discrete" values="0;1" keyTimes="0;0.3375"/><text x="108.0" y="124" class="mono" font-size="12.5" fill="#c3cad1" textLength="525.0" lengthAdjust="spacing">agents that hold a phone call, retrieval that walks a knowledge graph,</text></g><g><animate attributeName="opacity" dur="6.0s" fill="freeze" calcMode="discrete" values="0;1" keyTimes="0;0.3375"/><text x="108.0" y="143" class="mono" font-size="12.5" fill="#c3cad1" textLength="457.5" lengthAdjust="spacing">and routers that pick the smallest model that can do the job.</text></g><g><animate attributeName="opacity" dur="6.0s" fill="freeze" calcMode="discrete" values="0;1" keyTimes="0;0.3375"/><text x="108.0" y="162" class="mono" font-size="12.5" fill="#c3cad1" textLength="420.0" lengthAdjust="spacing">web, mobile or desktop: whatever screen it has to reach.</text></g><g><animate attributeName="opacity" dur="6.0s" fill="freeze" calcMode="discrete" values="0;1" keyTimes="0;0.3708"/><text x="108" y="181" class="mono" font-size="12.5" fill="#8d97a1" textLength="120.0" lengthAdjust="spacing">rahul@github ~ %</text></g><rect x="235.5" y="169" width="7.5" height="15" fill="#d9dee2"><animate attributeName="x" dur="6.0s" fill="freeze" calcMode="discrete" values="235.5;243.0;250.5;258.0;265.5;273.0;280.5;288.0;295.5;303.0;310.5;318.0;235.5" keyTimes="0.0000;0.1500;0.1625;0.1750;0.1875;0.2000;0.2125;0.2250;0.2375;0.2500;0.2625;0.2750;0.3708"/><animate attributeName="y" dur="6.0s" fill="freeze" calcMode="discrete" values="55;55;55;55;55;55;55;55;55;55;55;55;169" keyTimes="0.0000;0.1500;0.1625;0.1750;0.1875;0.2000;0.2125;0.2250;0.2375;0.2500;0.2625;0.2750;0.3708"/><animate attributeName="opacity" begin="2.225s" dur="1.1s" calcMode="discrete" values="1;0" keyTimes="0;0.5" repeatCount="indefinite"/></rect>
